<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Shadiii Karooo</h1>
    <input type="number" id="input" placeholder="Enter Age">
    <button onclick="checkAge()">Check Eligiblity</button><h1 id="response"></h1>
    <script>
        function checkAge(){
            let age=Number (document.getElementById("input").value)
            let res=document.getElementById("response")
            if(age>=21){
                res.innerText="You are eligible!!!"
                res.style.color="green"
            }
            else{
                 res.innerText="You are not eligible!!!"
                 res.style.color="red"
            }
        }
    </script>
</body>
</html>
