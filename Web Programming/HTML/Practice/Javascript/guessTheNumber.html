<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #164e63, #0f766e);
        }

        h1 {
            color: #f8fafc;
            font-size: 42px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        input {
            width: 260px;
            height: 52px;
            padding: 10px 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #2dd4bf;
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            color: #0f172a;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        input:focus {
            border-color: #facc15;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
        }

        button {
            height: 48px;
            min-width: 135px;
            padding: 0 18px;
            margin-top: 16px;
            margin-left: 0;
            border: none;
            border-radius: 10px;
            background: #2dd4bf;
            color: #042f2e;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        button:hover {
            background: #5eead4;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        button+button {
            margin-left: 15px;
        }

        button:last-of-type {
            background: #fb7185;
            color: white;
        }

        button:last-of-type:hover {
            background: #f43f5e;
        }

        h3 {
            width: 430px;
            padding: 17px 20px;
            margin-top: 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #f8fafc;
            text-align: center;
            font-size: 17px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        #result {
            color: #facc15;
            font-weight: bold;
        }

        #remainingAttempts {
            color: #0f172a;
            font-weight: bold;
        }
    </style>
</head>

<body>

   
  <h1>Guess The Number ?</h1>
  <input type="number" id="input" /><button onclick="guessNum()" id="guessbtn">
    Make a Guess
  </button>
  <button onclick="restartGame()">Restart Game</button>
  <h3>Result: <span id="result">---</span></h3>
  <h3>Remaining Attempts: <span id="remainingAttempts">5</span></h3>

  <script>
    let randomNum = Math.floor(Math.random() * 100) + 1;
    let remainingAttemptsCount = 5;

    console.log("Random Number:", randomNum);
    console.log("Initial Attempts:", remainingAttemptsCount);
    function guessNum() {
      let guessedNum = Number(document.getElementById("input").value);
      let result = document.getElementById("result");

      console.log("Guessed Number:", guessedNum);
      console.log("Random Number:", randomNum);
      console.log("Attempts Before:", remainingAttemptsCount);

      if (guessedNum < 1 || guessedNum > 100) {
        result.innerText = "Please enter number in range of 1 to 100";
        result.style.color = "red";
        return;
      }

      let remainingAttempts = document.getElementById("remainingAttempts");

      let secretNum = randomNum;

      if (remainingAttemptsCount > 0) {

        if (guessedNum > secretNum) {

          result.innerText = "Too High!!!!";

        } else if (guessedNum < secretNum) {

          result.innerText = "Too Low!!!!";

        } else {

          result.innerText = "You Guessed the Correct Number!!!!";

          console.log("Correct Number");
          console.log("Game Won");
          

        }


        remainingAttemptsCount--;

        console.log("Attempts After Decrement:", remainingAttemptsCount);

        remainingAttempts.innerText = remainingAttemptsCount;
       
      }
       if (remainingAttemptsCount ===0 && guessedNum != secretNum) {

          result.innerText =
            "Game Over!!!! Secret Number was: " + secretNum;

          console.log("Game Over");

           document.getElementById("guessbtn").style.display="none"
         
        
      }
    }
    function restartGame() {
      randomNum = Math.floor(Math.random() * 100) + 1;

      document.getElementById("input").value = "";
      remainingAttemptsCount = 5;
      document.getElementById("remainingAttempts").innerText =
        remainingAttemptsCount;
      document.getElementById("result").innerText = "---";
       document.getElementById("guessbtn").style.display=""
    }
  </script>

</body>

</html>
