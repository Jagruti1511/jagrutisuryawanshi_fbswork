<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student List</h1>
    <button>Get Student List</button>
    <ol id="slist"></ol>

    <script>
        let slist = document.querySelector("#slist");
        let students = ["Jagruti","Sahara","Vaibhav","Mayur","Kiran"];
        document.querySelector("button").addEventListener("click",function(){
            studentsforEach(function(ele){
                slist.innerHTML += "<li>" + ele+ "<li>";
            });
        });
    </script>
</body>
</html>
