<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>

async function getData() {

    let final_id = 3;

    let response = await fetch(
        `https://jsonplaceholder.typicode.com/users/${final_id}`
    );

    let data = await response.json();

    let name = data.name;

    console.log(`User Name: ${name}`);
}

async function demo() {

    console.log("1");

    await getData();

    console.log("2");
}

demo();

</script>

</body>
</html>
