<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature</title>
</head>
<body>

    <h1>Check Temperature</h1>

    <input type="number" id="input" placeholder="Enter Temperature">

    <button onclick="checkTemperature()">Check</button>

    <h1 id="response"></h1>

    <script>

        function checkTemperature(){

            let temp = Number(document.getElementById("input").value)

            let res = document.getElementById("response")

            if(temp >= 30){
                res.innerText = "It is Hot!!!"
                res.style.color = "red"
            }
            else{
                res.innerText = "It is Cool!!!"
                res.style.color = "blue"
            }
        }

    </script>

</body>
</html>
