
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Search</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      }

      h1 {
        text-align: center;
        color: #333;
        font-size: 24px;
        margin-bottom: 25px;
      }

      .search-box {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
      }

      input {
        flex: 1;
        padding: 12px 15px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
      }

      input:focus {
        border-color: #667eea;
      }

      button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #667eea;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #5568d9;
        transform: translateY(-2px);
      }

      .details {
        background: #f7f8fc;
        padding: 20px;
        border-radius: 12px;
        border-left: 5px solid #667eea;
      }

      .details p {
        margin: 12px 0;
        color: #555;
        font-size: 16px;
      }

      .details span {
        color: #222;
        font-weight: bold;
      }

      .address-title {
        margin-top: 20px;
        margin-bottom: 5px;
        color: #333 !important;
        font-weight: bold;
      }

      .address {
        padding-left: 15px;
        border-left: 3px solid #ddd;
      }
    </style>
  </head>

  <body>
    <div class="container">

      <h1>🔎 Employee Search</h1>

      <div class="search-box">
        <input type="number" id="emp_id" placeholder="Enter Employee ID" />
        <button id="btn">Search</button>
      </div>

      <div class="details">
        <p>Name: <span id="name">---</span></p>

        <p>Username: <span id="username">---</span></p>

        <p>E-mail: <span id="email">---</span></p>

        <p class="address-title">📍 Address</p>

        <div class="address">
          <p>Street: <span id="street">---</span></p>
          <p>City: <span id="city">---</span></p>
        </div>

        <p>🌐 Website: <span id="website">---</span></p>
      </div>

    </div>

    <script>
      let button = document.getElementById("btn");
      let input = document.getElementById("emp_id");

      button.addEventListener("click", function () {

        let entered_id = input.value;
        let final_id = Number(entered_id);

        fetch(`https://jsonplaceholder.typicode.com/users/${final_id}`)
          .then(function (response) {
            if(response.ok){
                document.getElementById("result").innerText="User Found!!!"
                return response.json();
            }
             document.getElementById("result").innerText="User Not Found!!!"
            
          })
          .then(function (data) {

            document.getElementById("name").innerText = data.name;
            document.getElementById("username").innerText = data.username;
            document.getElementById("email").innerText = data.email;
            document.getElementById("street").innerText = data.address.street;
            document.getElementById("city").innerText = data.address.city;
            document.getElementById("website").innerText = data.website;

          });
          .catch(function(error){
            document.getElementById("result").innerText=error.message
          })
      });
    </script>

  </body>
</html>
