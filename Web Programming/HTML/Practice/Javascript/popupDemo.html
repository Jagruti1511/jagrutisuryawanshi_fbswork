<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #popup{
        display: none;
        width: 300px;
        padding: 20px;
        background: white;
        border: 2px solid black;
        position: fixed;
        top: 30%;
        left: 40%;
    }
</style>
<body>
    <h1>My Website</h1>
    <div id="popuphe">
        <h2>Welcome!</h2>
        <p>This is a popup.</p>
        <button onclick="closePopup">close</button>
         
    </div>
    <script>
        setTimeout(function(){
            document.getElementById("popup").style.display="block"
        },3000);

        function closePopup(){
            document.getElementById("popup")..display="none"
        }
    </script>
</body>
</html>
