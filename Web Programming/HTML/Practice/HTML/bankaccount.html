<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Opening Form</title>
</head>
<body>

    <h2>Bank Account Opening Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" placeholder="Enter Full Name" required>
        <br><br>

        <label>Father's Name:</label>
        <input type="text">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        
        <br><br>

        <label>Email:</label>
        <input type="email" required>
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" minlength="10" maxlength="10">
        <br><br>

        <label>Aadhaar Number:</label>
        <input type="number">
        <br><br>

        <label>PAN Number:</label>
        <input type="text">
        <br><br>

        <label>Address:</label><br>
        <textarea rows="4" cols="30" placeholder="Enter Address"></textarea>
        <br><br>

        <label>City:</label>
        <input type="text">
        <br><br>

        <label>State:</label>
        <input type="radio" value="Maharastra">Maharastra
        <br><br>
         <input type="radio" value="Karnataka">Karnataka
        <br><br>
         <input type="radio" value="Gujrat">Gujrat
        <br><br>
         <input type="radio" value="Hariyana">Hariyana
        <br><br>
          <input type="radio" value="Delhi">Delhi
        <br><br>
        

        <label>Pincode:</label>
        <input type="number">
        <br><br>

        <label>Account Type:</label><br><br>
        <input type="radio" value="Select Account">Select Account
        <br><br>
        <input type="radio" value="Savings Account">Savings Account
        <br><br>
        <input type="radio" value="Current Account">Current Account
        <br><br>
        <input type="radio" value="Select Account">Salary Account
        <br><br>
        <label>Occupation:</label>
        <input type="text">
        <br><br>

        <label>Monthly Income:</label>
        <input type="number">
        <br><br>

        <label>Upload Aadhaar:</label>
        <input type="file">
        <br><br>

        <label>Upload PAN Card:</label>
        <input type="file">
        <br><br>

        <label>Upload Passport Size Photo:</label>
        <input type="file">
        <br><br>

        <label>Services Required:</label><br>

        <input type="checkbox"> ATM Card <br>
        <input type="checkbox"> Internet Banking <br>
        <input type="checkbox"> Mobile Banking <br>
        <input type="checkbox"> Cheque Book <br><br>

        <input type="checkbox" required>
        I hereby declare that the information provided is true.
        <br><br>

        <input type="submit">
        <input type="reset">

    </form>

</body>
</html>
