<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning forms</title>
</head>

<body>
    <form>
        <label>Upload your resumee</label> <br><br>

        <input type="text"><br><br>
        <label>UserName</label>
        <input type="text" autofocus><br><br>
        <label>Password</label>
        <input type="password"><br><br>
        <label>Name:</label>
        <input type="text" placeholder="Enter full name"><br><br>
        <label>College Code:</label>
        <input type="number" value="2004" readonly><br><br>
        <label>Email:</label>
        <input type="email" required><br><br>
        <label>City:</label>
        <input type="text"><br><br>
        <label>Phone Number</label>
        <input type="tel" minlength="10" maxlength="10"><br><br>
        <label>Date of birth</label>
        <input type="date"><br><br>


        <label>Gender:</label>
        <input type="radio" name="gender" value="Male">
        <label>Male</label>

        <input type="radio" name="gender" value="Female">
        <label>Female</label><br><br>

        <label for="skills">Skills:</label>

        <select id="skills" name="skills" multiple>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
        </select>
        <br><br>
        <input type="Submit">
        <input type="reset">


        
        </form>
    </form>
</body>

</html>
